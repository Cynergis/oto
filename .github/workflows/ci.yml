name: CI

# Every gate, on every push. tools/run_gates.sh runs the same set locally. See docs/GATES.md.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install with intake extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[intake,dev]"
      - name: Tests
        run: python -m pytest
      - name: Greenfield self-test
        run: oto verify
      - name: Starter vocabularies must build and answer
        run: python tools/check_ontologies.py

  bare:
    name: compile with no third-party packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install without extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Assert nothing third-party was pulled in
        # The compile path is stdlib-only by design. A dependency creeping in breaks the promise
        # that a build needs no installation beyond OTO itself.
        run: |
          extra=$(python -m pip list --format=freeze \
            | grep -viE '^(oto|oto-kg|oto_kg|pip|setuptools|wheel)==' || true)
          if [ -n "$extra" ]; then
            echo "::error::the base install pulled in third-party packages:"; echo "$extra"; exit 1
          fi
          echo "base install is dependency-free"
      - name: Greenfield self-test with no parsers
        run: oto verify
      - name: Markdown ingest must still work with no parsers
        run: |
          oto init --slug bare --project /tmp/bare-project
          printf '# Notes\n\nA line.\n' > /tmp/bare-project/inbox/notes.md
          oto ingest --project /tmp/bare-project
          test -f /tmp/bare-project/build/documents/notes.md

  neo4j:
    name: neo4j target and store (live)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports: [ "7687:7687" ]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the neo4j extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,neo4j]"
      - name: Load, verify, retire, and answer alike from both stores
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: testpassword
        run: python -m pytest -q tests/test_neo4j_target.py tests/test_store_equivalence.py

  syntax:
    name: every module compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Byte-compile (also proves 3.9 syntax compatibility)
        run: python -m compileall -q oto tools tests

  publishable:
    name: no client data or credentials
    runs-on: ubuntu-latest
    # A fork cannot read the deny-term secret, so the strict scan runs only for branches in this
    # repository. Forks still get the credential scan in the `credentials` job below.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Strict scan
        env:
          OTO_DENY_TERMS: ${{ secrets.OTO_DENY_TERMS }}
        run: python tools/check_publishable.py --strict

  signoff:
    name: every commit is signed off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for a Signed-off-by trailer
        # OTO uses a Developer Certificate of Origin sign-off, not a contributor licence agreement.
        # `git commit -s` adds the trailer. See CONTRIBUTING.md and DCO. The range ends at the
        # branch head, not HEAD: on a pull request run HEAD is the synthetic merge commit, which
        # nobody signs.
        run: |
          missing=0
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $sha has no Signed-off-by trailer. Fix with: git commit -s --amend"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "$missing commit(s) are not signed off."
            exit 1
          fi
          echo "every commit is signed off"

  credentials:
    name: no credentials (forks included)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Credential scan
        # No deny terms here on purpose: a fork has no secret. Credential patterns are built in, so
        # this still catches a leaked token.
        run: python tools/check_publishable.py

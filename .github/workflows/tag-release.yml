name: tag release

# Every version that reaches main gets its tag, v<version>, so a project's oto.lock.json can pin the
# engine it was built with: `oto lock --script` installs oto-kg from that tag. A new tag then opens the
# registry pull request that moves the engine's pin to it (registry-pin.yml): a tag pushed by this
# workflow starts no other workflow, so that is a job here, not a workflow on tags. The same tag
# publishes the sandbox kit at that version (kit-publish.yml).

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the version when it is new
        id: tag
        run: |
          version=$(python3 -c "import re; print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$tag"
            git push origin "refs/tags/$tag"
            echo "tagged $tag"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  pin:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/registry-pin.yml
    with:
      plugin: oto
      repo: Cynergis/oto
      tag: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.version }}
      changelog: CHANGELOG.md
      engine_ref: ${{ needs.tag.outputs.tag }}
    secrets:
      OTO_REGISTRY_TOKEN: ${{ secrets.OTO_REGISTRY_TOKEN }}

  kit:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/kit-publish.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets:
      DOCKER_SBX_USERNAME: ${{ secrets.DOCKER_SBX_USERNAME }}
      DOCKER_SBX_TOKEN: ${{ secrets.DOCKER_SBX_TOKEN }}

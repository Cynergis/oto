<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The product</title>
<link rel="stylesheet" href="_studio/studio.css">
<style>
.places h2 { margin-top: 28px; }
.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
a.page { display: block; background: var(--st-panel); border: 1px solid var(--st-line); border-radius: 10px; padding: 14px 16px;
         color: inherit; text-decoration: none; }
a.page:hover, a.page:focus-visible { border-color: var(--st-accent); outline: none; }
a.page strong { color: var(--st-accent); }
</style>
<script src="_studio/data.js"></script>
</head>
<body data-studio="bare">
<main class="studio-page">
  <h1 id="name">The product</h1>
  <p class="studio-lead">Everything recorded about this product, page by page.</p>
  <div class="places" id="places"><p class="studio-none">Loading…</p></div>
</main>
<script>
(function () {
  var D = window.__STUDIO__;
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); };
  var box = document.getElementById("places");
  if (!D) {
    box.innerHTML = '<p class="studio-none">Nothing to show yet: serve the project with <code>oto serve --http</code>, ' +
                    'or build it with <code>oto build --target site</code>.</p>';
    return;
  }
  // the product's front page, when its type's pack provides one
  if (D.portal) { location.replace(D.portal + "/" + location.hash); return; }
  var name = (D.project && D.project.name) || "The product";
  document.getElementById("name").textContent = name;
  document.title = name;
  var byName = {};
  (D.pages || []).forEach(function (p) { byName[p.name] = p; });
  var html = (D.places || []).filter(function (place) { return place.pages.length; }).map(function (place) {
    return "<h2>" + esc(place.label) + '</h2><div class="pages">' + place.pages.map(function (n) {
      var p = byName[n];
      return '<a class="page" href="' + esc(p.path) + '"><strong>' + esc(p.title) + "</strong>" +
             (p.summary ? '<br><span class="studio-muted">' + esc(p.summary) + "</span>" : "") + "</a>";
    }).join("") + "</div>";
  }).join("");
  box.innerHTML = html || '<p class="studio-none">This product has no pages yet.</p>';
})();
</script>
</body>
</html>

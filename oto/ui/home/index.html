<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project views</title>
<style>
:root { --bg: #f7f7f5; --panel: #fff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc; --accent: #2f5d8a; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #34332f; --accent: #8db8e3; }
}
:root[data-theme="dark"] { --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #34332f; --accent: #8db8e3; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
h1 { margin: 0; font-size: 24px; }
.sub { color: var(--muted); margin: 4px 0 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
a.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
         color: inherit; text-decoration: none; }
a.card:hover, a.card:focus { border-color: var(--accent); outline: none; }
a.card h2 { margin: 0 0 6px; font-size: 16px; color: var(--accent); }
a.card p { margin: 0; color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="name">Project</h1>
  <p class="sub">The views of this project's knowledge base, read from the graph. Each comes from a pack the project uses.</p>
  <div class="grid" id="views"><p class="empty">Loading…</p></div>
</main>
<script>
(function () {
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); };
  fetch("views.json", {cache: "no-store"}).then(function (r) {
    if (!r.ok) throw new Error("views.json " + r.status);
    return r.json();
  }).then(function (d) {
    var name = (d.project && d.project.name) || "Project";
    document.getElementById("name").textContent = name;
    document.title = name + " · views";
    var views = d.views || [];
    document.getElementById("views").innerHTML = views.length ? views.map(function (v) {
      return '<a class="card" href="' + esc(v.path) + '"><h2>' + esc(v.name) + "</h2><p>" + esc(v.summary) + "</p></a>";
    }).join("") : '<p class="empty">This project has no views.</p>';
  }).catch(function (e) {
    document.getElementById("views").innerHTML = '<p class="empty">No views: ' + esc(e.message) +
      '. Serve the project with <code>oto serve --http</code>, or build it with <code>oto build --target site</code>.</p>';
  });
})();
</script>
</body>
</html>

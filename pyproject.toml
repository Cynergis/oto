[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The DISTRIBUTION name. `oto` is taken on the package index, so the distribution is `oto-kg`
# while the import name and the command stay `oto`. Those are separate namespaces.
name = "oto-kg"
version = "0.9.3"
description = "OTO, Ontology-To-Operations: from enterprise meaning to running agents. Build, validate and serve a temporal knowledge graph from your own documents and conversations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Cynergis AI" }]
keywords = ["knowledge-graph", "ontology", "temporal", "rag", "provenance"]
dependencies = []

# The compile path is stdlib-only on purpose: a build needs no third-party packages.
# Document extraction needs parsers, so they live in an optional extra.
[project.optional-dependencies]
# Every dependency here is permissive: MIT, BSD-3-Clause or Apache-2.0. See
# THIRD-PARTY-LICENSES.md. pypdfium2 replaced PyMuPDF, which is AGPL-3.0 or commercially licensed.
intake = ["python-docx", "python-pptx", "pypdfium2", "pdfplumber", "beautifulsoup4", "lxml", "openpyxl"]
# rdflib (BSD-3-Clause) reads the RDF export back in the tests, and pyshacl (Apache-2.0) checks that
# the SHACL the export writes finds what the engine finds. Never runtime dependencies: the export is
# written, and the shapes are evaluated, by the stdlib compile path.
dev = ["pytest", "rdflib", "pyshacl"]
# Benchmarking only. Never a runtime dependency: the engine must never need a model to answer.
# fastembed is Apache-2.0, onnxruntime MIT, numpy BSD-3-Clause.
bench = ["fastembed", "numpy"]
# Drafting only. The one place OTO calls a model, and only when `oto draft` is run.
draft = ["anthropic>=0.40"]
# Loading the built graph into a self-hosted Neo4j. The driver is Apache-2.0. Optional target.
neo4j = ["neo4j>=5"]
# Reading a real ontology (OWL, RDFS, SKOS, any RDF syntax) with `oto ontology import --file`.
# rdflib is BSD-3-Clause. The compile path never needs it: the export is written by the stdlib.
rdf = ["rdflib>=7"]
# Everything a full installation uses at once: extraction, the production store, the drafter, the
# benchmark baseline and the ontology reader. Not the test tooling, which is `dev`.
all = ["python-docx", "python-pptx", "pypdfium2", "pdfplumber", "beautifulsoup4", "lxml", "openpyxl",
       "neo4j>=5", "anthropic>=0.40", "fastembed", "numpy", "rdflib>=7"]

[project.scripts]
oto = "oto.cli:main"

[tool.setuptools.packages.find]
include = ["oto*"]

# The starter vocabularies are data inside the package, so an installed engine can find them.
[tool.setuptools.package-data]
oto = ["ontologies/*/*", "ontologies/*/*/*", "ui/*/*", "ui/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on an unraised warning rather than letting it accumulate unseen.
filterwarnings = ["error::DeprecationWarning:oto.*"]
addopts = "-q --strict-markers"
